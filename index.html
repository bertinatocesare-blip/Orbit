#app{position:relative; z-index:1; display:flex; flex-direction:column; height:100%; max-width:520px; margin:0 auto;}
header{
  padding:6px 18px;
  padding-top:calc(6px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.55); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
}
header h1{font-size:17px; margin:0; font-weight:600; letter-spacing:.3px;}
header .sub{font-size:12px; color:var(--sub);}
main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px; padding-bottom:20px;}
nav{
  display:flex; border-top:1px solid var(--border); background:rgba(255,255,255,.65); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav button{
  flex:1; background:none; border:none; color:var(--sub); font-size:10.5px;
  padding:6px 2px 4px; display:flex; flex-direction:column; align-items:center; gap:2px;
  font-family:inherit;
}
nav button svg{width:20px; height:20px; stroke:var(--sub); fill:none; stroke-width:1.6;}
nav button.active{color:var(--accent);}
nav button.active svg{stroke:var(--accent);}
.card{background:var(--panel); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:14px;}
.center{display:flex; flex-direction:column; align-items:center; text-align:center;}
.big{font-size:38px; font-weight:700; letter-spacing:.5px;}
.small{font-size:12px; color:var(--sub); margin-top:4px;}
input[type=text],input[type=date],input[type=datetime-local],textarea{
  width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:11px 12px; font-size:15px; font-family:inherit;
}
textarea{resize:vertical; min-height:140px;}
button.btn{
  background:var(--accent); color:#fff; border:none; border-radius:10px; font-weight:600;
  padding:12px; font-size:15px; width:100%; font-family:inherit;
}
button.btn.secondary{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
button.btn.danger{background:var(--danger); color:#fff;}
.row{display:flex; gap:10px;}
.row>*{flex:1;}
svg text{fill:var(--sub); font-size:13px; font-family:inherit;}
.chip{
  display:inline-flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--border);
  border-radius:20px; padding:6px 12px; font-size:13px; margin:3px 4px 3px 0;
}
.dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
.session-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px;}
.session-row:last-child{border-bottom:none;}
.empty{color:var(--sub); font-size:13px; text-align:center; padding:20px 0;}
.week-row{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
.week-row-label{width:58px; flex:0 0 auto; font-size:10px; color:var(--sub); text-align:right;}
.week-row-cells{display:flex; gap:3px; flex-wrap:wrap; flex:1;}
.week-cell-sm{width:13px; height:13px; border-radius:2px; background:#1c2129; flex:0 0 auto;}
.week-cell-sm.past{background:var(--accent2); opacity:.6;}
.week-cell-sm.now{background:var(--accent); opacity:1;}
.dense-grid{display:grid; grid-template-columns:repeat(26,1fr); gap:3px;}
.dense-label{grid-column:1/-1; font-size:10px; color:var(--sub); padding:6px 0 2px;}
.dense-cell{aspect-ratio:1; border-radius:2px; background:#ffffff; box-shadow:inset 0 0 0 1px rgba(30,90,190,.15);}
.dense-cell.lived{background:#26b5d6; box-shadow:none;}
details.tg{border:1px solid var(--border); border-radius:10px; background:var(--panel2); margin-top:8px;}
details.tg>summary{list-style:none; cursor:pointer; padding:8px 12px; font-weight:600; font-size:13px; display:flex; justify-content:space-between; align-items:center; min-height:0;}
details.tg>summary::-webkit-details-marker{display:none;}
details.tg>summary::after{content:'›'; font-size:16px; color:var(--sub); transition:transform .2s; line-height:1;}
details.tg[open]>summary::after{transform:rotate(90deg);}
details.tg .tg-body{padding:0 12px 12px;}
.day-head{display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--accent); text-transform:capitalize; padding:10px 0 2px; border-bottom:1px solid var(--border);}
.lived-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(64px,1fr)); gap:8px;}
.lived-cell{
  aspect-ratio:1; border-radius:9px; background:#b9dcfb; color:#0b2a5b;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:10px; line-height:1.35; font-weight:700; text-align:center; padding:4px;
}
.lived-cell.written{background:#26b5d6; color:#04304d;}
.lived-cell.now{background:#0f3d9c; color:#fff;}

.menu-btn{background:none;border:none;padding:4px;color:var(--text);}
.menu-btn svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.8;display:block;}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;}
.drawer{position:fixed;top:0;bottom:0;left:0;width:72%;max-width:300px;background:rgba(240,247,255,.96);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .22s;z-index:11;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 16px;}
.drawer-title{font-size:12px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.drawer button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);font-size:16px;padding:14px 8px;border-bottom:1px solid var(--border);font-family:inherit;}
body.drawer-open .scrim{opacity:1;pointer-events:auto;}
body.drawer-open .drawer{transform:none;}

.modal-scrim{position:fixed;inset:0;background:rgba(10,30,70,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal{width:100%;max-width:400px;background:rgba(245,250,255,.97);border-radius:18px;padding:22px;box-shadow:0 10px 40px rgba(0,30,90,.3);}
.modal .q{font-size:17px;line-height:1.4;font-weight:700;text-align:center;margin-bottom:16px;color:var(--text);}
label.btn.secondary{background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:10px; font-weight:600; padding:12px; font-size:15px; width:100%; cursor:pointer;}

.focus-q{font-size:16px; line-height:1.4; font-weight:700; text-align:center; color:var(--text); padding:14px 16px; background:var(--panel); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border:1px solid var(--border); border-radius:16px; width:100%;}
.scale{display:grid; grid-template-columns:repeat(11,1fr); gap:4px; margin:14px 0 6px;}
.scale button{aspect-ratio:1; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-weight:700; font-size:14px; font-family:inherit; padding:0;}
.scale button.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
.scale-legend{display:flex; justify-content:space-between; font-size:11px; color:var(--sub);}
.arrow-btn{display:block; margin:18px auto 0; width:56px; height:56px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:26px; line-height:56px; padding:0;}
.arrow-btn:disabled{opacity:.35;}
.worry{padding:10px 0; border-bottom:1px solid var(--border);}
.worry:last-child{border-bottom:none;}
.worry-text{font-size:15px; margin-bottom:8px; word-break:break-word;}
.worry-text.done{text-decoration:line-through; color:var(--sub);}
.chips{display:flex; gap:6px; flex-wrap:wrap;}
.chips button{border:1px solid var(--border); background:var(--panel2); color:var(--text); border-radius:16px; padding:5px 12px; font-size:12px; font-weight:600; font-family:inherit;}
.chips button.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
.chips button.del{margin-left:auto; color:var(--danger);}
.bars{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; align-items:end; height:110px; margin-top:6px;}
.bar{background:var(--accent2); border-radius:5px 5px 0 0; min-height:2px;}
.bar-lbl{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; font-size:11px; color:var(--sub); text-align:center; margin-top:4px;}
.undo-btn{border:none; background:var(--text); color:#fff; border-radius:16px; padding:5px 12px; font-size:12px; font-weight:600; font-family:inherit;}
.steps{display:flex; justify-content:center; gap:6px; margin-bottom:12px;}
.steps span{width:8px; height:8px; border-radius:50%; background:rgba(30,90,190,.25);}
.steps span.on{background:var(--accent);}
.habit-row{display:flex; align-items:stretch; gap:0; margin-bottom:12px;}
.habit-card{flex:1; background:var(--panel); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border:1px solid var(--border); border-radius:16px; padding:16px; cursor:pointer;}
.habit-title{font-size:22px; font-weight:800; line-height:1.2; word-break:break-word;}
.habit-timer{font-size:15px; font-weight:600; color:var(--accent); margin-top:8px; font-variant-numeric:tabular-nums;}
.habit-meta{font-size:11px; color:var(--sub); margin-top:4px;}
.habit-side{width:64px; flex:0 0 64px; border-left:2px solid rgba(255,255,255,.85); margin-left:12px; padding-left:10px; display:flex; flex-direction:column; justify-content:center; gap:8px;}
.habit-side button{width:44px; height:44px; border-radius:12px; border:1px solid var(--border); background:var(--panel2); font-size:20px; font-weight:800; color:var(--sub); padding:0; font-family:inherit;}
.habit-side button.ok.sel{background:#22a06b; border-color:#22a06b; color:#fff;}
.habit-side button.no.sel{background:var(--danger); border-color:var(--danger); color:#fff;}
.habit-new{border-top:2px solid rgba(255,255,255,.85); margin-top:6px; padding-top:14px;}
</style>
</head>
<body>
<div id="bgPhoto"></div>
<div id="app">
  <header>
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div>
        <h1 id="headerTitle">Orbit</h1>
        <div class="sub" id="headerSub"></div>
      </div>
    </div>
    <div class="sub" id="headerClock"></div>
  </header>
  <main id="main"></main>
  <nav id="nav">
    <button data-tab="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Adesso</button>
    <button data-tab="day"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Giorno</button>
    <button data-tab="weeks"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Countdown</button>
    <button data-tab="habits"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>Habit</button>
    <button data-tab="reflect"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3 11.2V17h6v-2.8A6 6 0 0 0 12 3z"/><path d="M9.5 20h5"/></svg>Riflessione</button>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-title">Menu</div>
  <button data-open="settings">Impostazioni</button>
  <button data-open="notes">Settimane</button>
  <button data-open="tomorrow">Tomorrow</button>
  <button data-open="someday">Some day</button>
  <button data-open="weekly">Riflessione settimanale</button>
</aside>
<script>
// ---------- storage ----------
const STORE_KEY = 'orbit-data-v1';
function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { sessions: [], birthDate: null, notes: {}, noteLabels: {}, ageTargets: null, running: null };
}
let cloudRef = null, cloudTimer = null;
function saveData(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){}
  if(cloudRef){
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(()=>{ cloudRef.set({json: JSON.stringify(data), updated: Date.now()}).catch(()=>{}); }, 400);
  }
}
async function initCloud(){
  try{
    if(typeof claude === 'undefined' || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    const ref = db.doc('data/users/' + uid + '/orbit');
    const snap = await ref.get();
    if(snap.exists && snap.data() && snap.data().json){
      const d = JSON.parse(snap.data().json);
      data = Object.assign({ sessions: [], birthDate: null, notes: {}, noteLabels: {}, running: null, energy: {}, worries: [], weeklyReflections: {} }, d); ensureShape();
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){}
      cloudRef = ref;
      if(!document.querySelector('.modal-scrim') && document.activeElement?.tagName !== 'TEXTAREA') render();
    } else {
      cloudRef = ref;
      await ref.set({json: JSON.stringify(data), updated: Date.now()});
    }
  }catch(e){}
}
let data = loadData();
function ensureShape(){
  if(!data.noteLabels) data.noteLabels = {};
  if(!data.energy) data.energy = {};
  if(!Array.isArray(data.worries)) data.worries = [];
  if(!data.weeklyReflections) data.weeklyReflections = {};
  if(!Array.isArray(data.habits)) data.habits = [];
}
ensureShape();

// ---------- helpers ----------
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDuration(ms){
  const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h>0 ? `${h}h ${pad(m)}m` : `${m}m ${pad(sec)}s`;
}
function todayKey(d=new Date()){ return d.toISOString().slice(0,10); }
function isoWeekKey(d=new Date()){
  const t = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum = (t.getUTCDay()+6)%7;
  t.setUTCDate(t.getUTCDate()-dayNum+3);
  const firstThu = new Date(Date.UTC(t.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((t-firstThu)/86400000 - 3 + ((firstThu.getUTCDay()+6)%7))/7);
  return `${t.getUTCFullYear()}-W${pad(week)}`;
}
const MONTH_NAMES = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MONTH_ABBR = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function weekLabel(date){
  const year = date.getFullYear();
  const month = date.getMonth();
  const weekOfMonth = Math.ceil(date.getDate()/7);
  const key = `${year}-${pad(month+1)}-W${weekOfMonth}`;
  const display = `Anno ${year} · ${MONTH_NAMES[month]} · Settimana ${weekOfMonth}`;
  return {key, display};
}
function buildDenseGrid(count, lived){
  const cols = 26; // mezza riga = 6 mesi, 2 righe = 1 anno
  const rows = Math.ceil(count/cols);
  let html = '<div class="dense-grid">';
  for(let r=0;r<rows;r++){
    if(r%10===0) html += `<div class="dense-label">${r/2} anni</div>`;
    for(let c=0;c<cols;c++){
      const idx = r*cols+c;
      if(idx>=count) break;
      html += idx < (lived||0) ? '<div class="dense-cell lived"></div>' : '<div class="dense-cell"></div>';
    }
  }
  return html + '</div>';
}
function buildLabeledGrid(birth, count, reverse){
  const today = new Date();
  const weeksElapsed = weeksBetween(birth, today);
  const cells = [];
  for(let idx=0; idx<count; idx++){
    const isNow = idx===weeksElapsed;
    let cellDate = new Date(birth); cellDate.setDate(cellDate.getDate()+idx*7);
    if(isNow) cellDate = today;
    const key = weekLabel(cellDate).key;
    let cls = 'lived-cell';
    if(isNow) cls += ' now';
    else if(stripReport(data.notes[key])) cls += ' written';
    const wk = Math.ceil(cellDate.getDate()/7);
    cells.push(`<div class="${cls}" data-idx="${idx}"><span>${cellDate.getFullYear()}</span><span>${MONTH_ABBR[cellDate.getMonth()]}</span><span>S${wk}</span></div>`);
  }
  if(reverse) cells.reverse();
  return cells.join('');
}
const REPORT_START = '⟦REPORT⟧';
const REPORT_END = '⟦/REPORT⟧';
function weekSessions(key){
  return data.sessions.filter(s=> weekLabel(new Date(s.start)).key===key).sort((a,b)=>a.start-b.start);
}
function sessionLine(s){
  const d = new Date(s.start);
  const day = d.toLocaleDateString('it-IT',{weekday:'short', day:'numeric', month:'short'});
  const t = d.toLocaleTimeString('it-IT',{hour:'2-digit', minute:'2-digit'});
  return `${day} ${t} · ${s.activity} · ${fmtDuration(s.duration)}`;
}
function buildReportBlock(key){
  const ss = weekSessions(key);
  if(!ss.length) return '';
  return `${REPORT_START}\nStorico timer:\n${ss.map(x=>'- '+sessionLine(x)).join('\n')}\n${REPORT_END}`;
}
function syncWeekReport(key){
  const report = buildReportBlock(key);
  const userText = stripReport(data.notes[key]);
  data.notes[key] = report ? (report + (userText ? '\n\n'+userText : '')) : userText;
  if(!data.noteLabels[key]){
    const ss = weekSessions(key);
    if(ss.length) data.noteLabels[key] = weekLabel(new Date(ss[0].start)).display;
  }
}
function escHtml(t){ return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function historyByDayHtml(key){
  const ss = weekSessions(key);
  if(!ss.length) return '<div class="empty">Nessun timer registrato in questa settimana</div>';
  const days = {};
  ss.forEach(x=>{ const k=todayKey(new Date(x.start)); (days[k]=days[k]||[]).push(x); });
  return Object.keys(days).sort().map(k=>{
    const list = days[k];
    const tot = list.reduce((a,x)=>a+x.duration,0);
    const label = new Date(list[0].start).toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'});
    return `<div class="day-head"><span>${label}</span><span>${fmtDuration(tot)}</span></div>` +
      list.map(x=>`<div class="session-row"><span>${escHtml(x.activity)}</span><span class="small" style="margin:0;">${new Date(x.start).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})} · ${fmtDuration(x.duration)}</span></div>`).join('');
  }).join('');
}
function noteTogglesHtml(key, placeholder){
  const n = weekSessions(key).length;
  return `
    <details class="tg" open>
      <summary>Note</summary>
      <div class="tg-body">
        <textarea id="noteArea" placeholder="${placeholder}">${escHtml(stripReport(data.notes[key]))}</textarea>
        <div style="height:10px"></div>
        <button class="btn" id="saveNote">Salva</button>
      </div>
    </details>
    <details class="tg">
      <summary>Dati timer${n?' ('+n+')':''}</summary>
      <div class="tg-body">${historyByDayHtml(key)}</div>
    </details>`;
}
function stripReport(text){
  const re = new RegExp(REPORT_START.replace(/[⟦⟧]/g,'\\$&')+'[\\s\\S]*?'+REPORT_END.replace(/[⟦⟧]/g,'\\$&')+'\\n*');
  return (text||'').replace(re,'').trim();
}
async function exportData(){
  const json = JSON.stringify(data,null,2);
  const name = 'orbit-dati-' + todayKey() + '.json';
  try{
    if(typeof claude !== 'undefined' && claude.use){
      const downloads = await claude.use('downloads');
      if(downloads){ await downloads.save({filename:name, data:json}); return; }
    }
  }catch(e){ return; }
  try{
    const file = new File([json], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Orbit – dati'}); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  try{
    const url = URL.createObjectURL(new Blob([json],{type:'application/json'}));
    const a = document.createElement('a'); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000); return;
  }catch(e){}
  alert('Esportazione non riuscita.');
}
function importData(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!d || typeof d!=='object' || !Array.isArray(d.sessions)) throw new Error('bad');
      if(!confirm('Sostituire i dati attuali con quelli del file?')) return;
      data = Object.assign({ sessions: [], birthDate: null, notes: {}, noteLabels: {}, running: null, energy: {}, worries: [], weeklyReflections: {} }, d); ensureShape();
      saveData(); render(); alert('Dati importati ✓');
    }catch(e){ alert('File non valido.'); }
  };
  r.readAsText(file);
}

// ---------- header clock ----------
function tickHeader(){
  const now = new Date();
  document.getElementById('headerClock').textContent =
    now.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tickHeader,1000); tickHeader();

// ---------- tabs ----------
let currentTab = 'timer';
document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  notesWeekOverride = null;
  if(currentTab==='reflect') reflStep = -1;
  render();
});
let notesWeekOverride = null;
function setDrawer(open){ document.body.classList.toggle('drawer-open', open); }
document.getElementById('menuBtn').onclick = ()=>setDrawer(true);
document.getElementById('scrim').onclick = ()=>setDrawer(false);
document.getElementById('drawer').addEventListener('click', e=>{
  const b = e.target.closest('button[data-open]');
  if(!b) return;
  currentTab = b.dataset.open; notesWeekOverride = null; setDrawer(false); render();
});

// ---------- TIMER TAB ----------
let timerInterval = null;
function openActionModal(){
  const wrap = document.createElement('div');
  wrap.className = 'modal-scrim';
  wrap.innerHTML = `
    <div class="modal">
      <div class="q">Qual è la sola e unica cosa che puoi fare adesso affinché tutto poi sia più semplice?</div>
      <input type="text" id="modalActivity" placeholder="Scrivi cosa vuoi fare..." />
      <div style="height:14px"></div>
      <div class="row">
        <button class="btn secondary" id="modalCancel">Annulla</button>
        <button class="btn" id="modalConfirm">Conferma</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const input = wrap.querySelector('#modalActivity');
  setTimeout(()=>input.focus(), 50);
  const close = ()=> wrap.remove();
  wrap.querySelector('#modalCancel').onclick = close;
  wrap.addEventListener('click', e=>{ if(e.target===wrap) close(); });
  const confirm = ()=>{
    data.running = { activity: input.value.trim() || 'Attività', start: Date.now() };
    saveData(); close(); render();
  };
  wrap.querySelector('#modalConfirm').onclick = confirm;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') confirm(); });
}
function renderTimer(){
  document.getElementById('headerTitle').textContent = 'Adesso';
  document.getElementById('headerSub').textContent = '';
  const running = data.running;
  const main = document.getElementById('main');
  clearInterval(timerInterval);
  if(!running){
    main.innerHTML = `
      <div class="focus-q">Qual è la sola e unica cosa che puoi fare adesso affinché poi sia tutto più semplice?</div>
      <div style="display:flex;align-items:center;justify-content:center;padding:18px 0 20px;">
        <svg id="startCircle" width="280" height="280" viewBox="0 0 220 220" style="max-width:78vw;cursor:pointer;">
          <circle cx="110" cy="110" r="96" stroke="#5aaef5" stroke-width="10" fill="rgba(255,255,255,.35)"/>
        </svg>
      </div>
      <div class="card">
        <div class="small" style="margin-bottom:8px;">Storico di oggi</div>
        ${renderTodaySessions()}
      </div>`;
    document.getElementById('startCircle').onclick = openActionModal;
    return;
  }
  const safeAct = (running.activity||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  main.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:18px;">
      <div class="focus-q">Qual è la sola e unica cosa che puoi fare adesso affinché poi sia tutto più semplice?</div>
      <div class="card center" style="width:100%;margin:0;">
        <svg width="240" height="240" viewBox="0 0 220 220" style="max-width:75vw;">
          <circle cx="110" cy="110" r="96" stroke="#bcd3f2" stroke-width="10" fill="none"/>
          <circle id="ringProgress" cx="110" cy="110" r="96" stroke="#1d5fd8" stroke-width="10" fill="none"
            stroke-linecap="round" stroke-dasharray="603" stroke-dashoffset="603" transform="rotate(-90 110 110)"/>
          <text x="110" y="112" text-anchor="middle" font-size="28" fill="#0b2a5b" font-weight="700" id="ringTime">00:00:00</text>
          <text x="110" y="138" text-anchor="middle" font-size="13" fill="#46679b">${safeAct}</text>
        </svg>
      </div>
      <button class="btn danger" id="stopBtn">Ferma timer</button>
      <div class="card" style="width:100%;margin:0;">
        <div class="small" style="margin-bottom:8px;">Storico di oggi</div>
        ${renderTodaySessions()}
      </div>
    </div>
  `;
  const circle = document.getElementById('ringProgress');
  const timeEl = document.getElementById('ringTime');
  const tick = ()=>{
    const elapsed = Date.now() - running.start;
    const h = Math.floor(elapsed/3600000), m = Math.floor(elapsed%3600000/60000), sec = Math.floor(elapsed%60000/1000);
    timeEl.textContent = `${pad(h)}:${pad(m)}:${pad(sec)}`;
    circle.setAttribute('stroke-dashoffset', 603 - ((elapsed/1000) % 60 / 60)*603);
  };
  tick();
  timerInterval = setInterval(tick,1000);
  document.getElementById('stopBtn').onclick = ()=>{
    const end = Date.now();
    data.sessions.push({id:end, activity:running.activity || 'Attività', start:running.start, end, duration:end-running.start});
    syncWeekReport(weekLabel(new Date(running.start)).key);
    data.running = null; saveData(); clearInterval(timerInterval); render();
  };
}

// ---------- RIFLESSIONE ----------
let reflStep = -1;
let worryDraft = '';
const UNDO_MS = 10000;
const STATUS_LABEL = {done:'Done', someday:'Some day', tomorrow:'Tomorrow'};
function inUndo(w){ return w.status==='done' && w.doneAt && (Date.now()-w.doneAt) < UNDO_MS; }
function doneHidden(w){ return w.status==='done' && !inUndo(w); }
let undoTicker = null;
function ensureUndoTicker(){
  if(undoTicker) return;
  undoTicker = setInterval(()=>{
    const els = document.querySelectorAll('[data-undo-until]');
    if(!els.length){ clearInterval(undoTicker); undoTicker=null; return; }
    let expired = false;
    els.forEach(el=>{
      const left = Math.ceil((parseInt(el.dataset.undoUntil,10)-Date.now())/1000);
      if(left<=0) expired = true; else el.textContent = 'Annulla · '+left+'s';
    });
    if(expired){ clearInterval(undoTicker); undoTicker=null; render(); }
  }, 500);
}
function worryItemHtml(w, extra){
  if(inUndo(w)){
    const until = w.doneAt + UNDO_MS;
    return `<div class="worry" data-wid="${w.id}">
      <div class="worry-text done">${escHtml(w.text)}${extra||''}</div>
      <div class="chips"><button class="sel" disabled>Done ✓</button><button class="undo-btn" data-st="undo" data-undo-until="${until}">Annulla · ${Math.ceil((until-Date.now())/1000)}s</button></div>
    </div>`;
  }
  return `<div class="worry" data-wid="${w.id}">
    <div class="worry-text">${escHtml(w.text)}${extra||''}</div>
    <div class="chips">
      ${['done','someday','tomorrow'].map(st=>`<button data-st="${st}" class="${w.status===st?'sel':''}">${STATUS_LABEL[st]}</button>`).join('')}
      <button class="del" data-st="del">✕</button>
    </div>
  </div>`;
}
function bindWorryList(container){
  container.querySelectorAll('.worry').forEach(el=>{
    el.querySelectorAll('button[data-st]').forEach(b=>{
      b.onclick = ()=>{
        const w = data.worries.find(x=>String(x.id)===el.dataset.wid);
        if(!w) return;
        const st = b.dataset.st;
        if(st==='del'){
          if(!confirm('Eliminare questa voce?')) return;
          data.worries = data.worries.filter(x=>x!==w);
        } else if(st==='undo'){
          w.status = w.prevStatus || null; delete w.prevStatus; delete w.doneAt;
        } else if(st==='done'){
          w.prevStatus = w.status || null; w.status = 'done'; w.doneAt = Date.now();
        } else {
          w.status = (w.status===st) ? null : st;
        }
        saveData(); render();
      };
    });
  });
  if(container.querySelector('[data-undo-until]')) ensureUndoTicker();
}
function stepsHtml(n){ return `<div class="steps">${[1,2].map(i=>`<span class="${i<=n?'on':''}"></span>`).join('')}</div>`; }
function stopRunningTimer(){
  const running = data.running;
  if(!running) return;
  const end = Date.now();
  data.sessions.push({id:end, activity:running.activity || 'Attività', start:running.start, end, duration:end-running.start});
  syncWeekReport(weekLabel(new Date(running.start)).key);
  data.running = null;
}
function openReflectActionModal(){
  const wrap = document.createElement('div');
  wrap.className = 'modal-scrim';
  const running = data.running;
  wrap.innerHTML = `

function normPhrase(t){
  return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
}
function renderReflect(){
  document.getElementById('headerTitle').textContent = 'Riflessione';
  const tk = todayKey();
  document.getElementById('headerSub').textContent = new Date().toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'});
  const main = document.getElementById('main');
  if(reflStep===-1){
    main.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;min-height:100%;">
        <svg id="reflCircle" width="280" height="280" viewBox="0 0 220 220" style="max-width:78vw;cursor:pointer;">
          <circle cx="110" cy="110" r="96" stroke="#5aaef5" stroke-width="10" fill="rgba(255,255,255,.35)"/>
        </svg>
      </div>`;
    document.getElementById('reflCircle').onclick = ()=>{ reflStep = 1; render(); };
    return;
  }
  if(reflStep===0){
    const cur = data.energy[tk];
    main.innerHTML = `
      ${stepsHtml(0)}
      <div class="card">
        <div style="font-size:17px;font-weight:700;text-align:center;">Com'è la tua energia oggi?</div>
        <div class="scale">${Array.from({length:11},(_,i)=>`<button data-v="${i}" class="${cur===i?'sel':''}">${i}</button>`).join('')}</div>
        <div class="scale-legend"><span>Nessuna</span><span>Al massimo</span></div>
        <button class="arrow-btn" id="nextStep" ${cur===undefined?'disabled':''} aria-label="Avanti">→</button>
      </div>`;
    main.querySelectorAll('.scale button').forEach(b=>{
      b.onclick = ()=>{ data.energy[tk] = parseInt(b.dataset.v,10); saveData(); render(); };
    });
    document.getElementById('nextStep').onclick = ()=>{ reflStep = 1; render(); };
    return;
  }
  if(reflStep===1){
    const today = data.worries.filter(w=> todayKey(new Date(w.created))===tk && !doneHidden(w));
    main.innerHTML = `
      ${stepsHtml(1)}
      <div class="card">
        <div style="font-size:17px;font-weight:700;margin-bottom:12px;">Cosa ti preoccupa?</div>
        <div class="row">
          <input type="text" id="worryInput" placeholder="Scrivi una cosa alla volta..." value="${escHtml(worryDraft).replace(/"/g,'&quot;')}" />
          <button class="btn" id="addWorry" style="flex:0 0 auto;width:auto;padding:11px 16px;">+</button>
        </div>
      </div>
      <div class="card" id="worryList">
        ${today.length ? today.map(w=>worryItemHtml(w)).join('') : '<div class="empty">Ancora niente per oggi</div>'}
      </div>
      <div class="row">
        <button class="btn secondary" id="backStep">← Indietro</button>
        <button class="btn" id="toAction">Avanti →</button>
      </div>`;
    const input = document.getElementById('worryInput');
    input.addEventListener('input', ()=>{ worryDraft = input.value; });
    const add = ()=>{
      const t = input.value.trim();
      if(!t) return;
      data.worries.push({id: Date.now(), text: t, status: null, created: Date.now()});
      worryDraft = '';
      saveData(); render();
      setTimeout(()=>{ const i=document.getElementById('worryInput'); if(i) i.focus(); }, 30);
    };
    document.getElementById('addWorry').onclick = add;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') add(); });
    document.getElementById('backStep').onclick = ()=>{ reflStep = -1; render(); };
    document.getElementById('toAction').onclick = openReflectActionModal;
    bindWorryList(document.getElementById('worryList'));
    return;
  }
  // step 2
  main.innerHTML = `
    ${stepsHtml(2)}
    <div class="card center">
      <div style="font-size:17px;font-weight:700;margin-bottom:6px;">Scrivi:</div>
      <div style="font-size:22px;font-weight:700;color:var(--accent);margin-bottom:16px;">adesso sto bene</div>
      <input type="text" id="okInput" placeholder="adesso sto bene" autocomplete="off" autocapitalize="off" />
      <div style="height:14px"></div>
      <button class="btn" id="finishBtn" disabled style="opacity:.4;">Fine</button>
    </div>`;
  const ok = document.getElementById('okInput');
  const fin = document.getElementById('finishBtn');
  setTimeout(()=>ok.focus(), 50);
  ok.addEventListener('input', ()=>{
    const good = normPhrase(ok.value)==='adesso sto bene';
    fin.disabled = !good; fin.style.opacity = good ? '1' : '.4';
  });
  fin.onclick = ()=>{
    if(fin.disabled) return;
    if(!data.reflectionsDone) data.reflectionsDone = {};
    data.reflectionsDone[tk] = Date.now();
    saveData();
    reflStep = -1; render();
  };
}
function renderBucket(status, title){
  document.getElementById('headerTitle').textContent = title;
  const list = data.worries.filter(w=> w.status===status || (inUndo(w) && w.prevStatus===status)).sort((a,b)=>b.created-a.created);
  document.getElementById('headerSub').textContent = list.length + (list.length===1?' voce':' voci');
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card" id="bucketList">${list.length ? list.map(w=>worryItemHtml(w, ` <span class="small" style="margin:0;">· ${new Date(w.created).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</span>`)).join('') : '<div class="empty">Nessuna voce</div>'}</div>`;
  bindWorryList(document.getElementById('bucketList'));
}
function renderWeekly(){
  const now = new Date();
  const monday = new Date(now); monday.setHours(0,0,0,0); monday.setDate(monday.getDate() - ((monday.getDay()+6)%7));
  const wk = isoWeekKey(now);
  document.getElementById('headerTitle').textContent = 'Riflessione settimanale';
  const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);
  document.getElementById('headerSub').textContent = monday.toLocaleDateString('it-IT',{day:'numeric',month:'short'}) + ' – ' + sunday.toLocaleDateString('it-IT',{day:'numeric',month:'short'});
  const days = Array.from({length:7},(_,i)=>{ const d=new Date(monday); d.setDate(d.getDate()+i); return d; });
  const vals = days.map(d=>data.energy[todayKey(d)]);
  const recorded = vals.filter(v=>v!==undefined);
  const avg = recorded.length ? (recorded.reduce((a,b)=>a+b,0)/recorded.length).toFixed(1) : '-';
  const inWeek = data.worries.filter(w=> w.created >= monday.getTime() && w.created < sunday.getTime()+86400000);
  const count = st => inWeek.filter(w=>w.status===st).length;
  const open = inWeek.filter(w=>!w.status).length;
  main_ = document.getElementById('main');
  main_.innerHTML = `
    <div class="card">
      <div class="small" style="margin-bottom:6px;">Preoccupazioni di questa settimana</div>
      <div class="session-row"><span>Done</span><span>${count('done')}</span></div>
      <div class="session-row"><span>Tomorrow</span><span>${count('tomorrow')}</span></div>
      <div class="session-row"><span>Some day</span><span>${count('someday')}</span></div>
      <div class="session-row"><span>Da classificare</span><span>${open}</span></div>
    </div>
    <div class="card">
      <div class="small" style="margin-bottom:8px;">Cosa hai imparato questa settimana? Cosa vuoi cambiare?</div>
      <textarea id="weeklyText" placeholder="Scrivi la tua riflessione...">${escHtml(data.weeklyReflections[wk]||'')}</textarea>
      <div style="height:10px"></div>
      <button class="btn" id="saveWeekly">Salva</button>
    </div>`;
  document.getElementById('saveWeekly').onclick = ()=>{
    data.weeklyReflections[wk] = document.getElementById('weeklyText').value; saveData();
    const b = document.getElementById('saveWeekly'); b.textContent='Salvato ✓'; setTimeout(()=>b.textContent='Salva',1200);
  };
}
let main_;

// ---------- HABIT ----------
let habitInterval = null;
function dayStart(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function dayDiff(a,b){ return Math.round((dayStart(b)-dayStart(a))/86400000); }
function applyHabitResets(h){
  // Giorni interi senza spunta dopo l'ultima spunta (o dalla partenza) oltre la soglia => il timer riparte
  let changed = false;
  for(let guard=0; guard<1000; guard++){
    const startDay = dayStart(h.start);
    let ref = startDay;
    Object.keys(h.log||{}).forEach(k=>{
      if(h.log[k]==='ok'){ const d = new Date(k+'T00:00:00'); if(d>=startDay && d>ref) ref = d; }
    });
    const missed = dayDiff(ref, new Date()) - 1; // oggi non conta finché non finisce
    if(missed >= h.resetDays){
      const newStart = new Date(ref); newStart.setDate(newStart.getDate() + h.resetDays + 1);
      h.start = newStart.getTime();
      h.resets = (h.resets||0) + 1;
      changed = true;
    } else break;
  }
  return changed;
}
function fmtElapsed(ms){
  if(ms<0) ms = 0;
  const d = Math.floor(ms/86400000), h = Math.floor(ms%86400000/3600000), m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000);
  return `${d}g ${pad(h)}:${pad(m)}:${pad(s)}`;
}
function toLocalDT(ts){ const d=new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function openHabitModal(h){
  const isNew = !h;
  const wrap = document.createElement('div');
  wrap.className = 'modal-scrim';
  wrap.innerHTML = `
    <div class="modal">
      <div class="q">${isNew ? 'Nuovo habit' : 'Modifica habit'}</div>
      <div class="small" style="margin-bottom:6px;">Nome</div>
      <input type="text" id="hName" value="${isNew?'':escHtml(h.name).replace(/"/g,'&quot;')}" placeholder="Es. Niente social" />
      <div class="small" style="margin:12px 0 6px;">Data di partenza del timer</div>
      <input type="datetime-local" id="hStart" value="${toLocalDT(isNew?Date.now():h.start)}" />
      <div class="small" style="margin:12px 0 6px;">Il timer si azzera dopo quanti giorni senza spunta?</div>
      <input type="text" inputmode="numeric" id="hReset" value="${isNew?1:h.resetDays}" />
      <div style="height:16px"></div>
      <div class="row">
        <button class="btn secondary" id="hCancel">Annulla</button>
        <button class="btn" id="hSave">Salva</button>
      </div>
      ${isNew ? '' : '<div style="height:10px"></div><button class="btn danger" id="hDelete">Elimina habit</button>'}
    </div>`;
  document.body.appendChild(wrap);
  const close = ()=> wrap.remove();
  wrap.querySelector('#hCancel').onclick = close;
  wrap.addEventListener('click', e=>{ if(e.target===wrap) close(); });
  wrap.querySelector('#hSave').onclick = ()=>{
    const name = wrap.querySelector('#hName').value.trim();
    if(!name){ wrap.querySelector('#hName').focus(); return; }
    const st = wrap.querySelector('#hStart').value;
    const start = st ? new Date(st).getTime() : Date.now();
    const rd = Math.max(1, parseInt(wrap.querySelector('#hReset').value,10) || 1);
    if(isNew){
      data.habits.push({id: Date.now(), name, start, resetDays: rd, log: {}, resets: 0});
    } else {
      h.name = name; h.start = start; h.resetDays = rd;
    }
    saveData(); close(); render();
  };
  const del = wrap.querySelector('#hDelete');
  if(del) del.onclick = ()=>{
    if(!confirm('Eliminare questo habit?')) return;
    data.habits = data.habits.filter(x=>x!==h); saveData(); close(); render();
  };
}
function renderHabits(){
  document.getElementById('headerTitle').textContent = 'Habit';
  document.getElementById('headerSub').textContent = 'Oggi: ' + new Date().toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'});
  let changed = false;
  data.habits.forEach(h=>{ if(applyHabitResets(h)) changed = true; });
  if(changed) saveData();
  const tk = todayKey();
  const main = document.getElementById('main');
  main.innerHTML = `
    ${data.habits.length ? data.habits.map(h=>{
      const st = (h.log||{})[tk];
      return `<div class="habit-row" data-hid="${h.id}">
        <div class="habit-card">
          <div class="habit-title">${escHtml(h.name)}</div>
          <div class="habit-timer" data-start="${h.start}">${fmtElapsed(Date.now()-h.start)}</div>
          <div class="habit-meta">Si azzera dopo ${h.resetDays} ${h.resetDays===1?'giorno':'giorni'} senza spunta · tocca per modificare</div>
        </div>
        <div class="habit-side">
          <button class="ok ${st==='ok'?'sel':''}" data-v="ok" aria-label="Fatto">✓</button>
          <button class="no ${st==='no'?'sel':''}" data-v="no" aria-label="Non fatto">✕</button>
        </div>
      </div>`;
    }).join('') : '<div class="card"><div class="empty">Nessun habit ancora. Creane uno qui sotto.</div></div>'}
    <div class="habit-new">
      <button class="btn" id="newHabit">+ Nuovo habit</button>
    </div>`;
  main.querySelectorAll('.habit-row').forEach(row=>{
    const h = data.habits.find(x=>String(x.id)===row.dataset.hid);
    row.querySelector('.habit-card').onclick = ()=> openHabitModal(h);
    row.querySelectorAll('.habit-side button').forEach(b=>{
      b.onclick = ()=>{
        if(!h.log) h.log = {};
        if(h.log[tk]===b.dataset.v) delete h.log[tk]; else h.log[tk] = b.dataset.v;
        saveData(); render();
      };
    });
  });
  document.getElementById('newHabit').onclick = ()=> openHabitModal(null);
  habitInterval = setInterval(()=>{
    main.querySelectorAll('.habit-timer').forEach(el=>{
      el.textContent = fmtElapsed(Date.now() - parseInt(el.dataset.start,10));
    });
  }, 1000);
}

// ---------- render dispatcher ----------
function render(){
  clearInterval(timerInterval); clearInterval(dayInterval); clearInterval(habitInterval);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===currentTab));
  if(currentTab==='timer') renderTimer();
  else if(currentTab==='day') renderDay();
  else if(currentTab==='weeks') renderWeeks();
  else if(currentTab==='settings') renderSettings();
  else if(currentTab==='notes') renderNotes();
  else if(currentTab==='reflect') renderReflect();
  else if(currentTab==='tomorrow') renderBucket('tomorrow','Tomorrow');
  else if(currentTab==='someday') renderBucket('someday','Some day');
  else if(currentTab==='weekly') renderWeekly();
  else if(currentTab==='habits') renderHabits();
}
(function(){
  const keys = new Set(data.sessions.map(x=>weekLabel(new Date(x.start)).key));
  keys.forEach(syncWeekReport); saveData();
})();
render();
initCloud();
</script>
